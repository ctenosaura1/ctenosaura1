name: commit calendar
on:
  schedule: [{cron: "0 0 * * *"}] 
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          config_timezone: Asia/Hong_Kong
          base: ""
          plugin_isocalendar: yes
